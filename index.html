<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Android Emulator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .phone {
      width: 320px;
      height: 620px;
      margin: auto;
      background: #000;
      border: 8px solid #333;
      border-radius: 35px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,.5);
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb,
        #06b6d4
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .android-logo {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .screen h2 {
      margin: 0;
    }

    .status {
      margin-top: 20px;
      color: #9ca3af;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .apk {
      margin-top: 20px;
    }

    input {
      display: none;
    }

    .upload {
      display: inline-block;
      background: #16a34a;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .upload:hover {
      background: #15803d;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📱 My Android Emulator</h1>

    <div class="phone">

      <div class="screen" id="screen">

        <div class="android-logo">🤖</div>

        <h2>Android</h2>

        <p>Web Emulator</p>

      </div>

    </div>

    <div class="controls">

      <button onclick="goBack()">◀ Back</button>

      <button onclick="goHome()">● Home</button>

      <button onclick="recent()">▣ Recent</button>

      <button onclick="restart()">↻ Restart</button>

    </div>

    <div class="apk">

      <label class="upload">
        📦 Upload APK
        <input
          type="file"
          accept=".apk"
          onchange="uploadAPK(event)"
        >
      </label>

    </div>

    <div class="status" id="status">
      Emulator ready
    </div>

  </div>

<script>

function goBack() {
  document.getElementById("status").innerText =
    "Back button pressed";
}

function goHome() {
  document.getElementById("status").innerText =
    "Home button pressed";
}

function recent() {
  document.getElementById("status").innerText =
    "Recent Apps pressed";
}

function restart() {
  document.getElementById("status").innerText =
    "Restarting emulator...";

  setTimeout(() => {
    document.getElementById("status").innerText =
      "Emulator ready";
  }, 1500);
}

function uploadAPK(event) {

  const file = event.target.files[0];

  if (!file) return;

  document.getElementById("status").innerText =
    "APK selected: " + file.name;
}

</script>

</body>
</html>
